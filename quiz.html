<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini quiz game</title>
    <style>
        *{
            box-sizing: border-box;
            font-family: Arial, sans-serif;
          }
          body{
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
          }
          .quiz-box{
            width: 90%;
            max-width: 500px;
            background:whilte ;
            padding: 30px;
           border-radius: 20px;
           text-align: center;
           box-shadow: 0 10px 30px
           rgba(0, 0,0,0.3);
          }
          h1{
            margin-bottom: 10px;
            color: #333; }
            #question{
                font-size: 20px;
                 margin: 25px 0;
                 color: #444;

            }
            .option :hover {
                background: ddd;
            }
            #nextBtn, #restartBtn{
                padding: 12px 25px;
                border: none;
                border-radius: 10px;
                background: #667eea;
                color: white;
                cursor: pointer;
                font-size: 16px;
                margin-top: 15px ;
            }
            #nextBtn :hover, #restartBtn :hover{
                background: #4b5dcc;
            }
            #score{
                font-size: 22px;
                font-weight: bold;
                margin: 20px;

            }
        
    </style>
</head>
<body>
    <div class="quiz-box">
        <h1> mini quiz </h1>
        <p id="question"></p>
        <div id="options"></div>
        <button id="nextBtn"
        onclick="nextQuestion()">next
     </button>
        <div id="score"></div>
        <button id="restartBtn"
        onclick="restartquiz()" style="display: none;">
    Restart Quiz</button>

     

    </div>
    <script>

const questions = [
    {
        question: "Which language is used to create web pages?",
        options: ["Python", "HTML", "Java", "C++"],
        answer: "HTML"
    },

    {
        question: "Which tag is used for the largest heading?",
        options: ["<h6>", "<head>", "<h1>", "<heading>"],
        answer: "<h1>"
    },

    {
        question: "Which language is used for styling web pages?",
        options: ["HTML", "CSS", "Python", "SQL"],
        answer: "CSS"
    },

    {
        question: "Which language is mainly used to make websites interactive?",
        options: ["JavaScript", "HTML", "CSS", "SQL"],
        answer: "JavaScript"
    },

    {
        question: "Which tag is used to create a hyperlink?",
        options: ["<link>", "<a>", "<href>", "<url>"],
        answer: "<a>"
    }
];

let currentQuestion = 0;
let score = 0;

function loadQuestion() {

    let q = questions[currentQuestion];

    document.getElementById("question").innerText =
        (currentQuestion + 1) + ". " + q.question;

    let optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.options.forEach(function(option) {

        let button = document.createElement("button");

        button.innerText = option;
        button.className = "option";

        button.onclick = function() {

            if (option === q.answer) {
                score++;
                button.style.background = "lightgreen";
            } else {
                button.style.background = "pink";
            }

            document.querySelectorAll(".option").forEach(btn => {
                btn.disabled = true;
            });
        };

        optionsDiv.appendChild(button);
    });
}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        document.getElementById("question").innerText =
            "🎉 Quiz Completed!";

        document.getElementById("options").innerHTML = "";

        document.getElementById("nextBtn").style.display = "none";

        document.getElementById("score").innerText =
            "Your Score: " + score + " / " + questions.length;

        document.getElementById("restartBtn").style.display = "inline-block";
    }
}

function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("score").innerText = "";
    document.getElementById("nextBtn").style.display = "inline-block";
    document.getElementById("restartBtn").style.display = "none";

    loadQuestion();
}

loadQuestion();

</script>

</body>

</html>
